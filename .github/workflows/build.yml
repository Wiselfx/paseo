name: build
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:server
      - run: npm run build:daemon-web-ui
      - name: assert fork markers in web-ui bundle
        run: |
          test -d packages/server/dist/server/web-ui
          grep -rl "youtube-nocookie" packages/server/dist/server/web-ui --include='*.js' | head -n 3
          grep -rl "changedTouches" packages/server/dist/server/web-ui --include='*.js' | head -n 3
          echo "BUILD_SHA=${GITHUB_SHA}" > packages/server/dist/server/web-ui/FORK_BUILD
          cat packages/server/dist/server/web-ui/FORK_BUILD
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-daemon-${{ github.sha }}
          path: packages/server/dist
          retention-days: 30
